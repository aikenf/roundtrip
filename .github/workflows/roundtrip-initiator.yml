name: Roundtrip Initiator (Station 0)

on:
  schedule:
    # Monthly cron at 03:14 AM UTC. Dynamically updated by scripts/calculate_schedule.py
    - cron: '14 3 14 * *'
  workflow_dispatch:
    inputs:
      manual_round_id:
        description: 'Override Round ID (leave blank for automatic RT-YYYY-MM-DD-314)'
        required: false
        type: string
  repository_dispatch:
    types: [roundtrip_signal]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roundtrip-initiator
  cancel-in-progress: false

jobs:
  run-initiator:
    runs-on: ubuntu-latest
    if: github.repository == (vars.INITIATOR_REPO || 'kreier/roundtrip')
    steps:
      - name: Record Initialization Timestamp
        id: timestamps
        run: |
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          echo "started_at_utc=${NOW_UTC}" >> $GITHUB_OUTPUT
          TODAY=$(date -u +"%Y-%m-%d")
          echo "today=${TODAY}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore Persistent Telemetry from telemetry branch
        run: |
          if git fetch origin telemetry:telemetry 2>/dev/null; then
            echo "Restoring data/runs.json from telemetry branch..."
            git checkout telemetry -- data/runs.json || echo "Could not checkout runs.json from telemetry branch"
          else
            echo "No remote telemetry branch found. Using repository default data/runs.json."
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install --quiet pyjwt cryptography

      # -------------------------------------------------------------
      # Case A: Signal Returned to Station 0 (Loop Complete)
      # -------------------------------------------------------------
      - name: Handle Loop Closure & Seal Run
        if: github.event_name == 'repository_dispatch'
        id: loop_closure
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          STATION_ID: ${{ vars.STATION_ID || 'kreier-station-0' }}
        run: |
          echo "Signal returned to Initiator! Sealing loop..."
          echo '${{ toJson(github.event.client_payload) }}' > /tmp/payload.json
          ROUND_ID=$(jq -r '.round_id' /tmp/payload.json)
          SEQ=$(jq -r '.hop.sequence' /tmp/payload.json)

          python3 scripts/record_metrics.py \
            --round-id "${ROUND_ID}" \
            --station-id "${STATION_ID}" \
            --repo "${{ github.repository }}" \
            --sequence "${SEQ}" \
            --is-initiator \
            --is-loop-closure \
            --received-at "${{ steps.timestamps.outputs.started_at_utc }}" \
            --workflow-started-at "${{ steps.timestamps.outputs.started_at_utc }}" \
            --incoming-payload-file /tmp/payload.json

          # Elect next month's random day (1-30) and update cron schedule
          python3 scripts/calculate_schedule.py --update-workflow

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Commit cron update to main
          git add .github/workflows/roundtrip-initiator.yml
          git commit -m "chore(roundtrip): reschedule next month [skip ci]" || echo "No schedule changes"
          git push origin main || echo "Push to main skipped"

          # 2. Push sealed telemetry database to dedicated telemetry branch
          cp data/runs.json /tmp/runs_sealed.json
          git checkout telemetry 2>/dev/null || git checkout --orphan telemetry
          git rm -rf . 2>/dev/null || true
          mkdir -p data
          cp /tmp/runs_sealed.json data/runs.json
          git add data/runs.json
          git commit -m "chore(telemetry): seal round ${ROUND_ID} [skip ci]" || echo "No changes"
          git push origin telemetry || echo "Push to telemetry branch skipped"

      # -------------------------------------------------------------
      # Case B: Initiating New Round (Cron or Manual Trigger)
      # -------------------------------------------------------------
      - name: Determine Round ID
        if: github.event_name != 'repository_dispatch'
        id: round_meta
        run: |
          if [ -n "${{ inputs.manual_round_id }}" ]; then
            ROUND_ID="${{ inputs.manual_round_id }}"
          else
            ROUND_ID="RT-${{ steps.timestamps.outputs.today }}-314"
          fi
          echo "round_id=${ROUND_ID}" >> $GITHUB_OUTPUT
          SCHED_TIME="${{ steps.timestamps.outputs.today }}T03:14:00.000Z"
          echo "scheduled_time_utc=${SCHED_TIME}" >> $GITHUB_OUTPUT

      - name: Audit & Reconstruct Previous Round
        if: github.event_name != 'repository_dispatch'
        env:
          NEXT_STATION_REPO: ${{ vars.NEXT_STATION_REPO || 'offspring26/roundtrip' }}
          INITIATOR_REPO: ${{ github.repository }}
        run: |
          python3 scripts/reconstruct_round.py \
            --current-repo "${{ github.repository }}" \
            --next-repo "${NEXT_STATION_REPO}" \
            --initiator-repo "${INITIATOR_REPO}" || true

      - name: Record Initiator Telemetry
        if: github.event_name != 'repository_dispatch'
        env:
          STATION_ID: ${{ vars.STATION_ID || 'kreier-station-0' }}
        run: |
          python3 scripts/record_metrics.py \
            --round-id "${{ steps.round_meta.outputs.round_id }}" \
            --station-id "${STATION_ID}" \
            --repo "${{ github.repository }}" \
            --sequence 0 \
            --is-initiator \
            --scheduled-time "${{ steps.round_meta.outputs.scheduled_time_utc }}" \
            --received-at "${{ steps.timestamps.outputs.started_at_utc }}" \
            --workflow-started-at "${{ steps.timestamps.outputs.started_at_utc }}"

      - name: Setup Node & Build Dashboard
        if: github.event_name != 'repository_dispatch'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm dependencies & Build
        if: github.event_name != 'repository_dispatch'
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Pages
        if: github.event_name != 'repository_dispatch'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        if: github.event_name != 'repository_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.event_name != 'repository_dispatch'
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Dispatch Next Station via GitHub App
        if: github.event_name != 'repository_dispatch'
        env:
          ROUNDTRIP_APP_ID: ${{ secrets.ROUNDTRIP_APP_ID }}
          ROUNDTRIP_APP_PRIVATE_KEY: ${{ secrets.ROUNDTRIP_APP_PRIVATE_KEY }}
          NEXT_STATION_REPO: ${{ vars.NEXT_STATION_REPO || 'offspring26/roundtrip' }}
          STATION_ID: ${{ vars.STATION_ID || 'kreier-station-0' }}
        run: |
          echo "Pages deployed successfully. Dispatching downstream station..."
          python3 scripts/trigger_next.py \
            --target-repo "${NEXT_STATION_REPO}" \
            --round-id "${{ steps.round_meta.outputs.round_id }}" \
            --sequence 1 \
            --station-id "${STATION_ID}" \
            --current-repo "${{ github.repository }}"

      - name: Persist Initiator Telemetry to Dedicated Branch
        if: github.event_name != 'repository_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/runs.json /tmp/runs_init.json
          git checkout telemetry 2>/dev/null || git checkout --orphan telemetry
          git rm -rf . 2>/dev/null || true
          mkdir -p data
          cp /tmp/runs_init.json data/runs.json
          git add data/runs.json
          git commit -m "chore(telemetry): record initiator hop for round ${{ steps.round_meta.outputs.round_id }} [skip ci]" || echo "No changes"
          git push origin telemetry || echo "Push to telemetry branch skipped"
