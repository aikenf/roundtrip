name: Roundtrip Relay Station

on:
  repository_dispatch:
    types: [roundtrip_signal]
  workflow_dispatch:
    inputs:
      test_round_id:
        description: 'Test Round ID'
        required: false
        default: 'RT-TEST-MANUAL'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: roundtrip-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    if: github.repository != (vars.INITIATOR_REPO || 'kreier/roundtrip')
    steps:
      - name: Record Received & Startup Timestamps
        id: timestamps
        run: |
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          echo "started_at_utc=${NOW_UTC}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore Persistent Telemetry from telemetry branch
        run: |
          if git fetch origin telemetry:telemetry 2>/dev/null; then
            echo "Restoring data/runs.json from telemetry branch..."
            git checkout telemetry -- data/runs.json || echo "Could not checkout runs.json from telemetry branch"
          else
            echo "No remote telemetry branch found. Using repository default data/runs.json."
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          pip install --quiet pyjwt cryptography

      - name: Ingest Dispatch Payload
        id: parse_payload
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo '${{ toJson(github.event.client_payload) }}' > /tmp/payload.json
            ROUND_ID=$(jq -r '.round_id' /tmp/payload.json)
            SEQ=$(jq -r '.hop.sequence // 1' /tmp/payload.json)
            DISPATCHED_AT=$(jq -r '.hop.dispatched_at_utc // empty' /tmp/payload.json)
            DISPATCHED_BY=$(jq -r '.hop.dispatched_by_station // "unknown"' /tmp/payload.json)
          else
            echo "{}" > /tmp/payload.json
            ROUND_ID="${{ inputs.test_round_id }}"
            SEQ=1
            DISPATCHED_AT="${{ steps.timestamps.outputs.started_at_utc }}"
            DISPATCHED_BY="manual"
          fi

          echo "round_id=${ROUND_ID}" >> $GITHUB_OUTPUT
          echo "sequence=${SEQ}" >> $GITHUB_OUTPUT
          echo "dispatched_at_utc=${DISPATCHED_AT}" >> $GITHUB_OUTPUT
          echo "dispatched_by=${DISPATCHED_BY}" >> $GITHUB_OUTPUT

      - name: Verify Sender (Optional Defense-in-Depth)
        if: vars.EXPECTED_PREVIOUS_STATION != ''
        run: |
          EXPECTED="${{ vars.EXPECTED_PREVIOUS_STATION }}"
          SENDER="${{ steps.parse_payload.outputs.dispatched_by }}"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$SENDER" ]; then
            echo "::warning::Dispatched by '$SENDER', but expected '$EXPECTED'. Continuing with notice."
          fi

      - name: Reconstruct Prior Cycle
        env:
          NEXT_STATION_REPO: ${{ vars.NEXT_STATION_REPO || 'kreier/roundtrip' }}
          INITIATOR_REPO: ${{ vars.INITIATOR_REPO || 'kreier/roundtrip' }}
        run: |
          python3 scripts/reconstruct_round.py \
            --current-repo "${{ github.repository }}" \
            --next-repo "${NEXT_STATION_REPO}" \
            --initiator-repo "${INITIATOR_REPO}" \
            --current-round-id "${{ steps.parse_payload.outputs.round_id }}" || true

      - name: Record Station Metrics
        env:
          STATION_ID: ${{ vars.STATION_ID || github.repository_owner }}
        run: |
          python3 scripts/record_metrics.py \
            --round-id "${{ steps.parse_payload.outputs.round_id }}" \
            --station-id "${STATION_ID}" \
            --repo "${{ github.repository }}" \
            --sequence "${{ steps.parse_payload.outputs.sequence }}" \
            --received-at "${{ steps.parse_payload.outputs.dispatched_at_utc }}" \
            --workflow-started-at "${{ steps.timestamps.outputs.started_at_utc }}" \
            --incoming-payload-file /tmp/payload.json

      - name: Setup Node & Build Dashboard
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install npm dependencies & Build
        run: |
          npm ci || npm install
          npm run build
          mkdir -p dist/data
          cp data/runs.json dist/data/runs.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Dispatch Next Station via GitHub App
        env:
          ROUNDTRIP_APP_ID: ${{ secrets.ROUNDTRIP_APP_ID }}
          ROUNDTRIP_APP_PRIVATE_KEY: ${{ secrets.ROUNDTRIP_APP_PRIVATE_KEY }}
          NEXT_STATION_REPO: ${{ vars.NEXT_STATION_REPO || 'kreier/roundtrip' }}
          STATION_ID: ${{ vars.STATION_ID || github.repository_owner }}
        run: |
          NEXT_SEQ=$(( ${{ steps.parse_payload.outputs.sequence }} + 1 ))
          echo "Pages successfully deployed. Triggering next station ${NEXT_STATION_REPO} (sequence: ${NEXT_SEQ})..."

          python3 scripts/trigger_next.py \
            --target-repo "${NEXT_STATION_REPO}" \
            --round-id "${{ steps.parse_payload.outputs.round_id }}" \
            --sequence "${NEXT_SEQ}" \
            --station-id "${STATION_ID}" \
            --current-repo "${{ github.repository }}" \
            --payload-file /tmp/payload.json

      - name: Commit Updated Telemetry to Dedicated Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp data/runs.json /tmp/runs_to_persist.json
          git checkout telemetry 2>/dev/null || git checkout --orphan telemetry
          git rm -rf . 2>/dev/null || true
          mkdir -p data
          cp /tmp/runs_to_persist.json data/runs.json
          git add data/runs.json
          git commit -m "chore(telemetry): record station metrics for round ${{ steps.parse_payload.outputs.round_id }} [skip ci]" || echo "No changes"
          git push origin telemetry || echo "Push to telemetry branch skipped"
